name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `supabase db push` is irreversible against production. This environment
    # must be configured in Settings > Environments with at least one required
    # reviewer, otherwise the gate is decorative and every merge to main still
    # deploys unattended. Scope SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
    # SUPABASE_PROJECT_REF to this environment rather than to the repository.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deploy secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          shopt -s nullglob
          # Discovered from the filesystem so a new function ships by existing.
          # `_`-prefixed directories (_shared) are libraries, not functions.
          functions=()
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            [ -f "${dir}index.ts" ] || continue
            functions+=("$name")
          done
          if [ ${#functions[@]} -eq 0 ]; then
            echo "::error::No edge functions found under supabase/functions"
            exit 1
          fi
          echo "deploying ${#functions[@]} function(s): ${functions[*]}"
          supabase functions deploy "${functions[@]}" \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
