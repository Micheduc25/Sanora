[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.ai-coach]
verify_jwt = true

[functions.meal-analyze]
verify_jwt = true

[functions.generate-workout]
verify_jwt = true

[functions.generate-insights]
verify_jwt = true
