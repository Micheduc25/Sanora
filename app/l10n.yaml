arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L
nullable-getter: false
# Fail the build on a key that exists in English but not in French, rather
# than silently falling back and shipping half-translated screens.
untranslated-messages-file: l10n_untranslated.json
