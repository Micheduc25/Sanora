name: sanora
description: "Sanora — Know Your Body. AI-powered personal health companion."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Models & immutability
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.8.0
  connectivity_plus: ^6.1.4

  # Backend
  supabase_flutter: ^2.9.0

  # Local storage (offline-first)
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # UI
  fl_chart: ^0.71.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  flutter_svg: ^2.0.17

  # Purchases (App Store / Play Billing)
  in_app_purchase: ^3.3.0

  # Media & sensors
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # Utilities
  intl: any
  uuid: ^4.5.1
  collection: ^1.19.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  share_plus: ^11.0.0
  pdf: ^3.11.3
  printing: ^5.14.2

  # Notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1

  # Health platform integration
  health: ^12.2.0
  permission_handler: ^12.0.0+1
  sentry_flutter: ^8.14.2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb per l10n.yaml.
  generate: true
  assets:
    - assets/data/
    - assets/illustrations/exercises/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# Brand mark -> platform launcher icons. Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/sanora_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#10A56D"
  adaptive_icon_foreground: assets/icon/sanora_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/sanora_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/sanora_icon.png
    background_color: "#10A56D"
    theme_color: "#10A56D"

# Launch screen. Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#10A56D"
  image: assets/icon/sanora_splash.png
  color_dark: "#0E1512"
  image_dark: assets/icon/sanora_splash.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/icon/sanora_splash_android12.png
    color: "#10A56D"
    icon_background_color: "#10A56D"
    image_dark: assets/icon/sanora_splash_android12.png
    color_dark: "#0E1512"
    icon_background_color_dark: "#0E1512"
